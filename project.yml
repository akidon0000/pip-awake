name: PipAwake
options:
  bundleIdPrefix: dev.akidon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: XSC9AJPSP3
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  PipAwake:
    type: application
    platform: iOS
    sources:
      - path: PipAwake
    info:
      path: PipAwake/Info.plist
      properties:
        CFBundleDisplayName: Awake
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.akidon.pipawake
        PRODUCT_NAME: PipAwake
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  PipAwakeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PipAwakeTests
    dependencies:
      - target: PipAwake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.akidon.pipawake.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PipAwake:
    build:
      targets:
        PipAwake: all
        PipAwakeTests: [test]
    test:
      targets:
        - PipAwakeTests
    run:
      config: Debug
